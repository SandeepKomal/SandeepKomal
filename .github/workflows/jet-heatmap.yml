name: Update Jet Heatmap

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/jet-heatmap

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Generate contribution heatmap
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: dist/github-jet.svg
        run: node generate.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/github-jet.svg
          if git diff --cached --quiet; then
            echo "No heatmap changes."
          else
            git commit -m "chore: update jet heatmap SVG"
            git push
          fi
