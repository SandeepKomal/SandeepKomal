name: Update Engineering Momentum Stats

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/engineering-momentum-stats

permissions:
  contents: write

concurrency:
  group: update-engineering-momentum-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate activity consistency profile
        id: stats
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: activity-consistency

      - name: Stage complete artifact set
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: |
          mkdir -p profile-stats
          cp "$READY_DIR"/activity-consistency-*.svg profile-stats/
          test -s profile-stats/activity-consistency-wide-light.svg
          test -s profile-stats/activity-consistency-wide-dark.svg
          test -s profile-stats/activity-consistency-compact-light.svg
          test -s profile-stats/activity-consistency-compact-dark.svg
          git add profile-stats/activity-consistency-*.svg

      - name: Publish changed artifact set
        run: |
          if git diff --cached --quiet; then
            echo "No profile stat changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh engineering momentum stats"
          git push
