name: Update Engineering Profile Cards

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-engineering-profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@de0fac2e4500dabe86ba86f1e1b8685f8e4a348a # pinned checkout
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: false

      - name: Generate engineering profile cards
        uses: seijikohara/profile-cards-action@1e22eeeb0c3fe4ba86bb63f625cb75cec05ec030 # v1.14.2
        with:
          github-token: ${{ github.token }}
          username: ${{ github.repository_owner }}
          cards: cadence,portfolio
          output-dir: profile-stats
          themes: light,dark
          commit: false

      - name: Publish generated profile cards
        shell: bash
        run: |
          set -euo pipefail

          files=(
            profile-stats/cadence.light.svg
            profile-stats/cadence.dark.svg
            profile-stats/portfolio.light.svg
            profile-stats/portfolio.dark.svg
          )

          git add "${files[@]}"

          if git diff --cached --quiet; then
            echo "No profile card changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh engineering profile cards [skip ci]"

          # Publish only the generated SVG blobs onto the latest main.
          # Avoid rebasing SVG text, which can conflict with concurrent regenerations.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            latest_main="$(git rev-parse origin/main)"
            publish_branch="profile-cards-publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

            git branch -f "$publish_branch" "$latest_main"
            git checkout "$publish_branch"

            # Restore the just-generated SVGs onto the latest main tree.
            git checkout main -- "${files[@]}"
            git add "${files[@]}"

            if git diff --cached --quiet; then
              echo "Generated cards already match main."
              exit 0
            fi

            git commit -m "chore: refresh engineering profile cards [skip ci]"

            if git push origin HEAD:main; then
              echo "Profile cards published successfully."
              exit 0
            fi

            git checkout main
            git branch -D "$publish_branch" || true
            echo "Publish attempt $attempt did not succeed; retrying."
            sleep 2
          done

          echo "Failed to publish profile cards after 5 attempts."
          exit 1
