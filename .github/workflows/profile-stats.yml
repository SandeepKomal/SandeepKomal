name: Update Engineering Cadence

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-engineering-cadence
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate engineering cadence
        uses: seijikohara/profile-cards-action@1e22eeeb0c3fe4ba86bb63f625cb75cec05ec030 # v1.14.2
        with:
          github-token: ${{ github.token }}
          username: ${{ github.repository_owner }}
          cards: cadence
          output-dir: profile-stats
          themes: light,dark
          commit: false

      - name: Publish generated cadence
        run: |
          git add profile-stats/cadence.light.svg profile-stats/cadence.dark.svg
          if git diff --cached --quiet; then
            echo "No cadence changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh engineering cadence"
          git push
