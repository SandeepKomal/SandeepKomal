name: Update Engineering Profile Cards

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-engineering-profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: false

      - name: Generate engineering profile cards
        uses: seijikohara/profile-cards-action@1e22eeeb0c3fe4ba86bb63f625cb75cec05ec030 # v1.14.2
        with:
          github-token: ${{ github.token }}
          username: ${{ github.repository_owner }}
          cards: cadence,portfolio
          output-dir: profile-stats
          themes: light,dark
          commit: false

      - name: Publish generated profile cards
        shell: bash
        run: |
          set -euo pipefail

          files=(
            profile-stats/cadence.light.svg
            profile-stats/cadence.dark.svg
            profile-stats/portfolio.light.svg
            profile-stats/portfolio.dark.svg
          )

          # Keep generated files outside the checkout while syncing to the latest main.
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Expected generated file is missing or empty: $file"
              exit 1
            fi
            cp "$file" "$temp_dir/$(basename "$file")"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Regenerate a commit on top of the latest main on each attempt.
          # This avoids line-by-line merge conflicts in generated SVG files.
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt/5"
            git fetch origin main
            git checkout -B profile-cards-publish origin/main

            for file in "${files[@]}"; do
              cp "$temp_dir/$(basename "$file")" "$file"
            done

            git add "${files[@]}"

            if git diff --cached --quiet; then
              echo "No profile card changes."
              exit 0
            fi

            git commit -m "chore: refresh engineering profile cards [skip ci]"

            if git push origin HEAD:main; then
              echo "Profile cards published successfully."
              exit 0
            fi

            echo "Remote main changed or push failed; retrying."
            sleep 2
          done

          echo "Failed to publish profile cards after 5 attempts."
          exit 1
