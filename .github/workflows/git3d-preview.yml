# Preview run for the Git3D Universe redesign
# (SandeepKomal/Git3D-Universe pull request #17).
# Runs only on the git3d-preview branch; main and the live README are untouched.

name: Git3D Universe preview

on:
  push:
    branches:
      - git3d-preview
    paths:
      - .github/workflows/git3d-preview.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: git3d-preview
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Generate night theme
        uses: SandeepKomal/Git3D-Universe@d9678e7017e123650a833355e76f6cb003361a2a # claude/eager-cori-gt710n
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          theme: aurora
          output: git3d-preview/universe-dark.svg

      - name: Generate day theme
        uses: SandeepKomal/Git3D-Universe@d9678e7017e123650a833355e76f6cb003361a2a # claude/eager-cori-gt710n
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          theme: daylight
          output: git3d-preview/universe-light.svg

      - name: Checkout Git3D Universe renderer
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          repository: SandeepKomal/Git3D-Universe
          ref: claude/eager-cori-gt710n
          path: .git3d-src

      - name: Save contribution data for local design previews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const { fetchProfile } = await import(process.cwd() + "/.git3d-src/src/github.mjs");
            const data = await fetchProfile(process.env.GITHUB_REPOSITORY_OWNER, process.env.GITHUB_TOKEN);
            writeFileSync("git3d-preview/data.json", JSON.stringify(data));
          '
          rm -rf .git3d-src

      - name: Commit previews to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add git3d-preview/
          if git diff --cached --quiet; then
            echo "No preview changes."
          else
            git commit -m "chore: generate Git3D Universe preview"
            git push origin HEAD:git3d-preview
          fi
