name: Git3D Universe

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions: {}

concurrency:
  group: git3d-universe
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Git3D Universe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the rendered SVGs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One render per GitHub theme; the README picks with prefers-color-scheme.
      - name: Render for dark mode
        uses: SandeepKomal/Git3D-Universe@8628060b8294964c07119952bad257f27a46544b # v2.0.1
        with:
          username: ${{ github.repository_owner }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          theme: aurora
          output: profile/git3d-universe.svg

      - name: Render for light mode
        uses: SandeepKomal/Git3D-Universe@8628060b8294964c07119952bad257f27a46544b # v2.0.1
        with:
          username: ${{ github.repository_owner }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          theme: daylight
          output: profile/git3d-universe-light.svg

      - name: Validate
        env:
          EXPECTED_LOGIN: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for svg in profile/git3d-universe.svg profile/git3d-universe-light.svg; do
            test -s "$svg"
            grep -q "</svg>" "$svg"
            grep -qi "@${EXPECTED_LOGIN}" "$svg"
            if [ "$(wc -c < "$svg")" -lt 5000 ]; then
              echo "ERROR: $svg is unexpectedly small."
              exit 1
            fi
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # checkout keeps no credentials; the token is used for this push only
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add profile/git3d-universe.svg profile/git3d-universe-light.svg
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore: refresh Git3D Universe"
          # Other profile workflows also push to main, so rebase and retry.
          for attempt in 1 2 3 4; do
            git fetch -q origin main
            git rebase -q origin/main
            if git push -q origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Push failed after 4 attempts." >&2
          exit 1
