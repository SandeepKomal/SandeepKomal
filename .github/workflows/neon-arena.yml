name: Neon Arena

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/neon-arena.yml

permissions: {}

concurrency:
  group: neon-arena
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the rendered SVGs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One render per GitHub theme; the README picks with prefers-color-scheme.
      - name: Render for dark mode
        uses: SandeepKomal/neon-arena@933658603b49090272b1163aaeebcc5ab8d7ae94 # main, pre-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          theme: aurora
          output: neon-arena/arena.svg

      - name: Render for light mode
        uses: SandeepKomal/neon-arena@933658603b49090272b1163aaeebcc5ab8d7ae94 # main, pre-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          theme: daylight
          output: neon-arena/arena-light.svg

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # checkout keeps no credentials; the token is used for this push only
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for svg in neon-arena/arena.svg neon-arena/arena-light.svg; do
            test -s "$svg"
            grep -q "<svg" "$svg"
          done
          git add neon-arena/arena.svg neon-arena/arena-light.svg
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore: refresh Neon Arena"
          # Other profile workflows also push to main, so rebase and retry.
          for attempt in 1 2 3 4; do
            git fetch -q origin main
            git rebase -q origin/main
            if git push -q origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Push failed after 4 attempts." >&2
          exit 1
