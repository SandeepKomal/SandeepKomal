name: Neon Arena

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/neon-arena.yml

# Only repository contents are needed: generate the SVGs and commit them.
permissions:
  contents: write

concurrency:
  group: neon-arena
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1

      - name: Generate night theme
        uses: SandeepKomal/neon-arena@30b29e02629a439f93d5b5cefb5848f372404862 # main, pre-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          theme: aurora
          output: neon-arena/arena-dark.svg

      - name: Generate day theme
        uses: SandeepKomal/neon-arena@30b29e02629a439f93d5b5cefb5848f372404862 # main, pre-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          theme: daylight
          output: neon-arena/arena-light.svg

      - name: Publish generated SVGs
        shell: bash
        run: |
          set -euo pipefail

          git add neon-arena/arena-dark.svg neon-arena/arena-light.svg

          if git diff --cached --quiet; then
            echo "No Neon Arena changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Neon Arena"

          # Other profile workflows also push to main, so rebase and retry.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Neon Arena published."
              exit 0
            fi
            sleep 2
          done

          echo "Failed to publish Neon Arena after 3 attempts."
          exit 1
