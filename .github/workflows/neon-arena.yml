name: Neon Arena

on:
  schedule:
    # Hourly so the day/night theme flips close to the set times.
    - cron: "41 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/neon-arena.yml

# Only repository contents are needed: generate the SVG and commit it.
permissions:
  contents: write

concurrency:
  group: neon-arena
  cancel-in-progress: false

env:
  # Your local IANA timezone, e.g. Asia/Kolkata, America/New_York, Europe/London
  NEON_TIMEZONE: America/New_York
  # Daylight theme from 06:00 local time, aurora (night) from 18:00
  NEON_DAY_START: "06"
  NEON_NIGHT_START: "18"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pick theme by local time
        id: theme
        shell: bash
        run: |
          set -euo pipefail

          if ! TZ="${NEON_TIMEZONE}" date >/dev/null 2>&1; then
            echo "ERROR: Invalid IANA timezone: ${NEON_TIMEZONE}"
            exit 1
          fi

          # 10# forces base 10 so hours like 08 and 09 are not read as octal
          HOUR=$((10#$(TZ="${NEON_TIMEZONE}" date +%H)))

          if [ "${HOUR}" -ge "$((10#${NEON_DAY_START}))" ] && [ "${HOUR}" -lt "$((10#${NEON_NIGHT_START}))" ]; then
            THEME="daylight"
          else
            THEME="aurora"
          fi

          echo "Local hour: ${HOUR} -> theme: ${THEME}"
          echo "theme=${THEME}" >> "$GITHUB_OUTPUT"

      - name: Generate Neon Arena
        uses: SandeepKomal/neon-arena@933658603b49090272b1163aaeebcc5ab8d7ae94 # main, pre-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          theme: ${{ steps.theme.outputs.theme }}
          output: neon-arena/arena.svg

      - name: Publish generated SVG
        shell: bash
        run: |
          set -euo pipefail

          test -s neon-arena/arena.svg
          grep -q "<svg" neon-arena/arena.svg

          git add neon-arena/arena.svg

          if git diff --cached --quiet; then
            echo "No Neon Arena changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Neon Arena (${{ steps.theme.outputs.theme }})"

          # Other profile workflows also push to main, so rebase and retry.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Neon Arena published."
              exit 0
            fi
            sleep 2
          done

          echo "Failed to publish Neon Arena after 3 attempts."
          exit 1
